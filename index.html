<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>江翠校乳品訂購｜GitHub 測試</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #f4f8fb;
      color: #17324A;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(23, 50, 74, .08);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    .sub { color: #667785; margin: 0; }
    .notice {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eef5fb;
      line-height: 1.6;
    }
    .notice.ok { background: #eef8f0; color: #25643a; }
    .notice.error { background: #fff0f0; color: #9b3434; }
    .notice.warn { background: #fff8e9; color: #805d12; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 14px; }
    label { display:block; margin-bottom:6px; font-weight:700; }
    input, select, textarea {
      width:100%;
      border:1px solid #cbd8e1;
      border-radius:10px;
      padding:12px;
      font-size:16px;
      color:#17324A;
      background:#fff;
    }
    input[readonly] { background:#f2f5f7; }
    textarea { min-height: 84px; resize: vertical; }
    .checkrow { display:flex; gap:8px; align-items:center; margin: 8px 0 16px; }
    .checkrow input { width:auto; }
    button {
      width:100%;
      border:0;
      border-radius:11px;
      padding:13px 16px;
      font-size:16px;
      font-weight:700;
      background:#A1C6EA;
      color:#17324A;
      cursor:pointer;
    }
    button:hover { background:#8FB9E2; }
    button:disabled { opacity:.55; cursor:default; }
    .secondary { background:#BBD1EA; }
    .tertiary {
      margin-top: 10px;
      background:#DAE3E5;
    }
    .result {
      margin-top:14px;
      padding:14px;
      border-radius:12px;
      background:#eef5f5;
      line-height:1.7;
    }
    .small { font-size:14px; color:#6b7b87; }
    .debug {
      margin-top: 10px;
      padding: 10px 12px;
      background: #f6f8fa;
      border-radius: 10px;
      font-size: 13px;
      color: #536574;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hidden-frame { width:0; height:0; border:0; position:absolute; opacity:0; pointer-events:none; }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .card { padding: 16px; }
      .grid { grid-template-columns: 1fr; gap:0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>江翠校乳品訂購</h1>
      <p class="sub">GitHub 測試送單版</p>
      <div id="systemStatus" class="notice">正在讀取 GAS 系統設定……</div>
      <button id="retryBootstrapBtn" class="tertiary" type="button" hidden>重新讀取系統設定</button>
      <div id="debugBox" class="debug">尚未收到 GAS 回傳。</div>
    </div>

    <div class="card">
      <h2>測試送單</h2>
      <div class="notice warn">
        此頁目前只允許「測試學生」送單。若正式系統尚未開放，後端仍會依原規則拒絕送單；這不是按鈕故障。
      </div>

      <div class="grid" style="margin-top:14px">
        <div class="field">
          <label for="studentName">學生中文姓名</label>
          <input id="studentName" value="測試學生" readonly>
        </div>
        <div class="field">
          <label for="englishName">英文名（可留空）</label>
          <input id="englishName" autocomplete="off">
        </div>
        <div class="field">
          <label for="className">班級</label>
          <select id="className"><option value="">等待系統資料……</option></select>
        </div>
        <div class="field">
          <label for="phoneLast3">手機末三碼</label>
          <input id="phoneLast3" inputmode="numeric" maxlength="3" placeholder="例如 245">
        </div>
      </div>

      <div class="field">
        <label for="productCode">訂購品項</label>
        <select id="productCode"><option value="">等待系統資料……</option></select>
      </div>

      <div id="monthInfo" class="notice">訂購月份等待系統資料……</div>

      <div class="checkrow">
        <input id="needBag" type="checkbox">
        <label for="needBag" style="margin:0;font-weight:400">需要收費袋</label>
      </div>

      <div class="field">
        <label for="note">特殊備註（可留空）</label>
        <textarea id="note" maxlength="100"></textarea>
      </div>

      <button id="submitBtn" type="button" disabled>等待系統設定</button>
      <div id="submitResult"></div>
    </div>

    <div class="card">
      <h2>查詢既有訂單</h2>
      <div class="grid">
        <div class="field">
          <label for="queryName">學生中文全名</label>
          <input id="queryName">
        </div>
        <div class="field">
          <label for="queryLast3">手機末三碼</label>
          <input id="queryLast3" inputmode="numeric" maxlength="3">
        </div>
      </div>
      <button id="queryBtn" class="secondary" type="button">查詢訂購內容</button>
      <div id="queryResult"></div>
    </div>
  </div>

  <iframe class="hidden-frame" name="gasPostFrame" id="gasPostFrame"></iframe>
  <form id="gasPostForm" method="POST" target="gasPostFrame"
        action="https://script.google.com/macros/s/AKfycbxwLK8W7szrbDwW2LFddVUDUdnrVCnCOCep4RNBKx1B-dXq24kUkZ-cXTT-cwu8KK__FA/exec"
        style="display:none">
    <input type="hidden" name="action" id="postAction">
    <input type="hidden" name="requestId" id="postRequestId">
    <input type="hidden" name="payload" id="postPayload">
  </form>

<script>
  const form = document.getElementById('gasPostForm');
  const systemStatus = document.getElementById('systemStatus');
  const retryBootstrapBtn = document.getElementById('retryBootstrapBtn');
  const debugBox = document.getElementById('debugBox');
  const submitBtn = document.getElementById('submitBtn');
  const submitResult = document.getElementById('submitResult');
  const queryBtn = document.getElementById('queryBtn');
  const queryResult = document.getElementById('queryResult');

  let bootstrap = null;
  let bootstrapRequestId = '';
  let bootstrapTimer = null;
  const pending = new Map();

  function createRequestId() {
    return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  function setDebug(text) {
    debugBox.textContent = text;
  }

  function postToGas(action, payload) {
    const id = createRequestId();
    document.getElementById('postAction').value = action;
    document.getElementById('postRequestId').value = id;
    document.getElementById('postPayload').value = JSON.stringify(payload || {});
    pending.set(id, action);
    form.submit();
    setDebug(`已送出 ${action}\nrequestId=${id}\n等待 GAS 回傳……`);
    return id;
  }

  function loadBootstrap() {
    if (bootstrapTimer) clearTimeout(bootstrapTimer);
    bootstrap = null;
    submitBtn.disabled = true;
    submitBtn.textContent = '等待系統設定';
    retryBootstrapBtn.hidden = true;
    systemStatus.className = 'notice';
    systemStatus.textContent = '正在讀取 GAS 系統設定……';

    bootstrapRequestId = postToGas('bootstrap', {});

    bootstrapTimer = setTimeout(() => {
      if (bootstrap) return;
      if (!pending.has(bootstrapRequestId)) return;
      pending.delete(bootstrapRequestId);
      systemStatus.className = 'notice error';
      systemStatus.textContent = '讀取超過 15 秒，尚未收到 GAS 回傳。';
      retryBootstrapBtn.hidden = false;
      setDebug(`bootstrap 逾時\nrequestId=${bootstrapRequestId}\n請按「重新讀取系統設定」。`);
    }, 15000);
  }

  retryBootstrapBtn.addEventListener('click', loadBootstrap);

  window.addEventListener('message', event => {
    const msg = event.data || {};

    if (msg.source !== 'milk-gas-bridge' || msg.type !== 'response') {
      return;
    }

    setDebug(
      `收到 GAS 回傳\naction=${String(msg.action || '')}\nrequestId=${String(msg.requestId || '')}\nsuccess=${String(Boolean(msg.success))}` +
      (msg.error ? `\nerror=${msg.error}` : '')
    );

    if (!pending.has(msg.requestId)) {
      return;
    }

    const expected = pending.get(msg.requestId);
    pending.delete(msg.requestId);

    if (msg.action !== expected) {
      return;
    }

    if (msg.action === 'bootstrap') handleBootstrap(msg);
    if (msg.action === 'query') handleQuery(msg);
    if (msg.action === 'submit-test') handleSubmit(msg);
  });

  function handleBootstrap(msg) {
    if (bootstrapTimer) {
      clearTimeout(bootstrapTimer);
      bootstrapTimer = null;
    }

    if (!msg.success) {
      systemStatus.className = 'notice error';
      systemStatus.textContent = msg.error || '系統設定讀取失敗。';
      retryBootstrapBtn.hidden = false;
      return;
    }

    bootstrap = msg.data || {};
    const status = bootstrap.status || {};
    const p = bootstrap.period || {};

    systemStatus.className = status.canOrder ? 'notice ok' : 'notice warn';
    systemStatus.textContent = `${status.label || '系統資料已讀取'}｜${p.targetMonthText || ''}`;

    const classSelect = document.getElementById('className');
    classSelect.innerHTML = '<option value="">請選擇班級</option>' +
      (bootstrap.classes || []).map(v => `<option value="${escAttr(v)}">${esc(v)}</option>`).join('');

    const productSelect = document.getElementById('productCode');
    productSelect.innerHTML = '<option value="">請選擇品項</option>' +
      (bootstrap.products || []).map(item =>
        `<option value="${escAttr(item.code)}">${esc(item.name)}</option>`
      ).join('');

    document.getElementById('monthInfo').textContent =
      `${p.targetMonthText || ''}｜${p.displayText || ''}｜整月 ${p.bottleCount || 0} 瓶｜每瓶 NT$${p.unitPrice || 0}｜合計 NT$${p.amount || 0}`;

    if (status.canOrder) {
      submitBtn.disabled = false;
      submitBtn.textContent = '確認並送出測試訂單';
    } else {
      submitBtn.disabled = true;
      submitBtn.textContent = '目前尚未開放，無法測試送單';
      submitResult.innerHTML = `
        <div class="notice warn">
          系統資料已成功讀到，但目前正式訂購狀態不是「開放中」。<br>
          因後端仍沿用正式送單規則，所以現在不能真正寫入測試訂單。
        </div>`;
    }
  }

  submitBtn.addEventListener('click', () => {
    if (!bootstrap) return;

    const className = document.getElementById('className').value;
    const phoneLast3 = document.getElementById('phoneLast3').value.trim();
    const productCode = document.getElementById('productCode').value;

    if (!className) return showSubmitError('請選擇班級。');
    if (!/^\d{3}$/.test(phoneLast3)) return showSubmitError('請輸入 3 位手機末三碼。');
    if (!productCode) return showSubmitError('請選擇訂購品項。');

    const product = (bootstrap.products || []).find(p => p.code === productCode);
    const payload = {
      studentName: '測試學生',
      englishName: document.getElementById('englishName').value,
      className,
      phoneLast3,
      needBag: document.getElementById('needBag').checked,
      productCode,
      rotationMode: product && product.type === '輪送品項' ? '全部口味輪送' : '',
      selectedRotationCodes: [],
      orderType: '整月訂購',
      selectedDates: [],
      note: document.getElementById('note').value,
      requestToken: createRequestId()
    };

    if (!confirm(`確定送出測試訂單？\n\n測試學生／${className}\n${product ? product.name : productCode}\n${bootstrap.period?.displayText || ''}`)) return;

    submitBtn.disabled = true;
    submitBtn.textContent = '送出並確認資料中……';
    submitResult.innerHTML = '';
    postToGas('submit-test', payload);
  });

  function handleSubmit(msg) {
    const canOrder = Boolean(bootstrap && bootstrap.status && bootstrap.status.canOrder);
    submitBtn.disabled = !canOrder;
    submitBtn.textContent = canOrder ? '確認並送出測試訂單' : '目前尚未開放，無法測試送單';

    if (!msg.success) {
      showSubmitError(msg.error || '送單失敗。');
      return;
    }

    const result = msg.data || {};
    const order = result.order || {};
    submitResult.innerHTML = `
      <div class="notice ok">
        <strong>測試訂單已成功寫入，而且後端再次確認資料存在。</strong><br>
        訂單編號：${esc(order.orderNumber || '')}<br>
        學生：${esc(order.studentName || '')}<br>
        班級：${esc(order.className || '')}<br>
        品項：${esc(order.productName || '')}<br>
        瓶數：${esc(String(order.deliveryCount || ''))}<br>
        應繳金額：NT$${esc(String(order.amount || 0))}
      </div>`;
  }

  function showSubmitError(text) {
    submitResult.innerHTML = `<div class="notice error">${esc(text)}</div>`;
  }

  queryBtn.addEventListener('click', () => {
    const studentName = document.getElementById('queryName').value.trim();
    const phoneLast3 = document.getElementById('queryLast3').value.trim();

    if (!studentName || !/^\d{3}$/.test(phoneLast3)) {
      queryResult.innerHTML = '<div class="notice error">請輸入學生中文全名與 3 位手機末三碼。</div>';
      return;
    }

    queryBtn.disabled = true;
    queryBtn.textContent = '查詢中……';
    queryResult.innerHTML = '';
    postToGas('query', { studentName, phoneLast3 });
  });

  function handleQuery(msg) {
    queryBtn.disabled = false;
    queryBtn.textContent = '查詢訂購內容';

    if (!msg.success) {
      queryResult.innerHTML = `<div class="notice error">${esc(msg.error || '查詢失敗。')}</div>`;
      return;
    }

    const orders = msg.data || [];
    if (!orders.length) {
      queryResult.innerHTML = '<div class="result">查無符合的訂購資料。</div>';
      return;
    }

    queryResult.innerHTML = orders.map(o => `
      <div class="result">
        <strong>${esc(o.targetMonth || '')}｜${esc(o.productName || '')}</strong><br>
        學生：${esc(o.studentName || '')}<br>
        班級：${esc(o.className || '')}<br>
        配送：${esc(o.displayText || '')}<br>
        瓶數：${esc(String(o.deliveryCount || ''))}<br>
        應繳金額：NT$${esc(String(o.amount || 0))}<br>
        訂單編號：${esc(o.orderNumber || '')}
      </div>`).join('');
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function escAttr(v) {
    return esc(v);
  }

  loadBootstrap();
</script>
</body>
</html>
